services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idhtm
      POSTGRES_USER: idhtm
      POSTGRES_PASSWORD: idhtm_dev
    ports:
      - "5432:5432"
    volumes:
      - idhtm_postgres:/var/lib/postgresql/data
      
  backend:
    build: ./backend
    environment:
      IDHTM_ENV: development
      DATABASE_URL: postgresql://idhtm:idhtm_dev@postgres:5432/idhtm
      MAVLINK_URL: "tcp:host.docker.internal:14552" 
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_WS_URL: ws://localhost:8000/ws/telemetry
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  idhtm_postgres: